<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Expression Explainer</title>
  <meta name="description" content="Parse 5- and 6-field cron expressions offline. Get human-readable schedules and next run times with preset chips.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--font-primary:'Plus Jakarta Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;--bg:#090d16;--bg-card:rgba(17,24,39,.7);--border:rgba(255,255,255,.08);--text-primary:#f8fafc;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-indigo:#6366f1;--accent-cyan:#06b6d4;--accent-emerald:#10b981;--accent-rose:#f43f5e;--glow-indigo:rgba(99,102,241,.2);--shadow-card:0 10px 30px -10px rgba(0,0,0,.5);--transition:all .3s cubic-bezier(.16,1,.3,1)}
    [data-theme="light"]{--bg:#f8fafc;--bg-card:rgba(255,255,255,.8);--border:rgba(0,0,0,.08);--text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--accent-indigo:#4f46e5;--glow-indigo:rgba(79,70,229,.12)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-primary);background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column}
    header{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);background:rgba(9,13,22,.75);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
    [data-theme="light"] header{background:rgba(248,250,252,.85)}
    .brand{display:flex;align-items:center;gap:.75rem;font-size:1.25rem;font-weight:700;color:var(--text-primary);text-decoration:none}
    .brand i{color:var(--accent-indigo)}
    .header-nav{display:flex;align-items:center;gap:1.25rem}
    .nav-link{color:var(--text-secondary);text-decoration:none;font-weight:500;font-size:.9rem;display:flex;align-items:center;gap:.4rem}
    .nav-link:hover{color:var(--accent-indigo)}
    .theme-toggle-btn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:2.5rem 1.5rem 4rem}
    .page-title{text-align:center;margin-bottom:2rem}
    .page-title h1{font-size:2.25rem;font-weight:800;margin-bottom:.5rem}
    .page-title p{color:var(--text-secondary)}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.75rem;box-shadow:var(--shadow-card);backdrop-filter:blur(12px);margin-bottom:1.5rem}
    .cron-input{width:100%;font-family:var(--font-mono);font-size:1.1rem;padding:1rem;background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);text-align:center;letter-spacing:.05em}
    [data-theme="light"] .cron-input{background:rgba(255,255,255,.6)}
    .cron-input:focus{outline:none;border-color:var(--accent-indigo);box-shadow:0 0 0 3px var(--glow-indigo)}
    .field-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-top:.75rem;font-size:.7rem;color:var(--text-muted);text-align:center;text-transform:uppercase}
    .field-labels.six{grid-template-columns:repeat(6,1fr)}
    .presets{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
    .chip{padding:.4rem .85rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:.8rem;font-weight:600;cursor:pointer;transition:var(--transition)}
    .chip:hover{border-color:var(--accent-indigo);color:var(--accent-indigo);background:var(--glow-indigo)}
    .human{font-size:1.15rem;font-weight:600;color:var(--accent-cyan);margin:1rem 0}
    .runs-list{list-style:none}
    .runs-list li{padding:.65rem 0;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:.875rem;display:flex;justify-content:space-between}
    .runs-list li:last-child{border-bottom:none}
    .error-box{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);border-radius:10px;padding:1rem;color:var(--accent-rose)}
    .meta-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem;color:var(--text-secondary)}
    .meta-row span{background:rgba(99,102,241,.1);padding:.25rem .65rem;border-radius:6px}
    footer{border-top:1px solid var(--border);padding:1.5rem;text-align:center;font-size:.85rem;color:var(--text-muted)}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand"><i class="fa-solid fa-clock"></i><span>Cron Explainer</span></a>
    <div class="header-nav">
      <a href="index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Tools</a>
      <button class="theme-toggle-btn" id="theme-toggle"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>
  <main>
    <div class="page-title">
      <h1>Cron Expression Explainer</h1>
      <p>Understand 5- and 6-field cron schedules, see human-readable descriptions, and preview the next run times.</p>
    </div>
    <div class="card">
      <input type="text" class="cron-input" id="cron-input" value="0 9 * * 1-5" placeholder="0 9 * * 1-5" spellcheck="false">
      <div class="field-labels" id="field-labels"></div>
      <div class="presets" id="presets"></div>
      <div class="meta-row">
        <label>Next runs: <input type="number" id="run-count" value="10" min="1" max="50" style="width:50px;padding:.2rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-primary)"></label>
      </div>
    </div>
    <div class="card" id="results-card">
      <div id="results"><p style="color:var(--text-muted)">Enter a cron expression above.</p></div>
    </div>
  </main>
  <footer>
    <p>Cron Expression Explainer &bull; Processing stays in your browser &bull; Pure JavaScript, no external dependencies</p>
  </footer>
  <script src="scripts/cron_explainer/app.js"></script>
  <script>
    const themeToggle=document.getElementById('theme-toggle');
    function initTheme(){const t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);themeToggle.querySelector('i').className=t==='light'?'fa-solid fa-sun':'fa-solid fa-moon'}
    themeToggle.addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);themeToggle.querySelector('i').className=n==='light'?'fa-solid fa-sun':'fa-solid fa-moon'});
    initTheme();

    const cronInput=document.getElementById('cron-input');
    const resultsEl=document.getElementById('results');
    const fieldLabelsEl=document.getElementById('field-labels');
    const presetsEl=document.getElementById('presets');
    const runCountEl=document.getElementById('run-count');

    Object.keys(CronExplainer.PRESETS).forEach(name=>{
      const chip=document.createElement('button');
      chip.className='chip';
      chip.textContent=name;
      chip.addEventListener('click',()=>{cronInput.value=name;explain()});
      presetsEl.appendChild(chip);
    });

    function updateFieldLabels(is6){
      const names=is6?CronExplainer.FIELD_NAMES_6:CronExplainer.FIELD_NAMES_5;
      fieldLabelsEl.className='field-labels'+(is6?' six':'');
      fieldLabelsEl.innerHTML=names.map(n=>'<span>'+n+'</span>').join('');
    }

    function explain(){
      try{
        const cron=CronExplainer.parseCron(cronInput.value);
        updateFieldLabels(cron.is6);
        const human=CronExplainer.humanize(cron);
        const count=Math.min(50,Math.max(1,parseInt(runCountEl.value,10)||10));
        const runs=CronExplainer.nextRuns(cron,count);
        resultsEl.innerHTML=
          '<div class="meta-row"><span>'+cron.rawFields.length+' fields</span><span>'+(cron.is6?'6-field (with seconds)':'5-field (standard)')+'</span></div>'+
          '<div class="human"><i class="fa-solid fa-comment-dots"></i> '+escapeHtml(human)+'</div>'+
          '<div style="font-weight:700;margin-bottom:.75rem">Next '+count+' runs</div>'+
          '<ul class="runs-list">'+runs.map((d,i)=>'<li><span>#'+(i+1)+'</span><span>'+d.toLocaleString()+'</span></li>').join('')+'</ul>';
      }catch(err){
        resultsEl.innerHTML='<div class="error-box"><strong>Error:</strong> '+escapeHtml(err.message)+'</div>';
      }
    }

    function escapeHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

    cronInput.addEventListener('input',explain);
    runCountEl.addEventListener('change',explain);
    explain();
  </script>
</body>
</html>
